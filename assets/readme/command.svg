<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="/ship-site — type it in any agent">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity=".06" stroke-width="1"/></pattern>
    <radialGradient id="glow" cx="50%" cy="58%" r="60%"><stop offset="0" stop-color="#F59E0B" stop-opacity=".18"/><stop offset="1" stop-color="#F59E0B" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1280" height="400" rx="24" fill="#080808"/>
  <rect width="1280" height="400" rx="24" fill="url(#grid)"/>
  <rect width="1280" height="400" rx="24" fill="url(#glow)"/>

  <text x="80" y="76" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="20" fill="#7C7D82" letter-spacing="1">❯ type it in any agent</text>

  <text x="72" y="268" textLength="1040" lengthAdjust="spacingAndGlyphs"
        font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="176" font-weight="800" fill="#ECEDFD"><tspan fill="#F59E0B">/</tspan>ship-site</text>
  <rect x="1136" y="140" width="64" height="136" rx="6" fill="#F59E0B">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.5;.5;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="20" fill="#B8B9BC">
    <text x="80" y="340"><tspan fill="#F59E0B">audit</tspan> · quick · fix · release · smoke · rollback · status · resume</text>
  </g>
  <text x="1200" y="76" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="20" fill="#7C7D82">asks before anything leaves your machine</text>
</svg>
