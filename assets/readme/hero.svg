<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 600" width="1280" height="600" role="img" aria-label="ship-site: a terminal shows an audit turning a NO-GO into a GO with evidence for every gate">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity=".06" stroke-width="1"/></pattern>
    <radialGradient id="glow" cx="78%" cy="40%" r="55%"><stop offset="0" stop-color="#F59E0B" stop-opacity=".16"/><stop offset="1" stop-color="#F59E0B" stop-opacity="0"/></radialGradient>
    <linearGradient id="fade" x1="0" x2="1"><stop offset="0" stop-color="#080808"/><stop offset=".45" stop-color="#080808" stop-opacity=".6"/><stop offset="1" stop-color="#080808" stop-opacity="0"/></linearGradient>
  </defs>
  <rect width="1280" height="600" rx="24" fill="#080808"/>
  <rect width="1280" height="600" rx="24" fill="url(#grid)"/>
  <rect width="1280" height="600" rx="24" fill="url(#glow)"/>
  <rect width="1280" height="600" rx="24" fill="url(#fade)"/>

  <g transform="translate(72 150) scale(.17)"><rect width="512" height="512" rx="112" fill="#F59E0B"/><path d="M88 296H424L360 396H152Z" fill="#080808"/><path d="M168 296 256 112V296Z" fill="#080808"/><path d="M256 112 344 296H256Z" fill="#3A2606"/><path d="M88 296H424L408 321H104Z" fill="#F59E0B" opacity=".18"/></g>
  <text x="72" y="290" font-family="'Space Grotesk',Manrope,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="66" font-weight="700" letter-spacing="-1.5" fill="#ECEDFD">ship<tspan fill="#F59E0B">-</tspan>site</text>
  <text x="72" y="346" font-family="'Space Grotesk',Manrope,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="30" font-weight="600" fill="#ECEDFD">Ship the site. Keep the receipts.</text>
  <text font-family="Manrope,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" fill="#B8B9BC">
    <tspan x="72" y="392">From “feature done” to live in production for</tspan>
    <tspan x="72" y="418">Next.js marketing sites, with a GO / NO-GO</tspan>
    <tspan x="72" y="444">verdict where every claim has evidence.</tspan>
  </text>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" fill="#D6D7E4">
    <rect x="72" y="478" width="88" height="30" rx="15" fill="#FFFFFF" fill-opacity=".05" stroke="#FFFFFF" stroke-opacity=".16"/><text x="116" y="498" text-anchor="middle">audit</text>
    <rect x="170" y="478" width="68" height="30" rx="15" fill="#FFFFFF" fill-opacity=".05" stroke="#FFFFFF" stroke-opacity=".16"/><text x="204" y="498" text-anchor="middle">fix</text>
    <rect x="248" y="478" width="94" height="30" rx="15" fill="#FFFFFF" fill-opacity=".05" stroke="#FFFFFF" stroke-opacity=".16"/><text x="295" y="498" text-anchor="middle">release</text>
    <rect x="352" y="478" width="80" height="30" rx="15" fill="#FFFFFF" fill-opacity=".05" stroke="#FFFFFF" stroke-opacity=".16"/><text x="392" y="498" text-anchor="middle">smoke</text>
    <rect x="442" y="478" width="98" height="30" rx="15" fill="#FFFFFF" fill-opacity=".05" stroke="#FFFFFF" stroke-opacity=".16"/><text x="491" y="498" text-anchor="middle">rollback</text>
  </g>

  <g transform="translate(616 88)">
    <rect width="600" height="424" rx="16" fill="#101010" stroke="#FFFFFF" stroke-opacity=".16"/>
    <path d="M0 16A16 16 0 0 1 16 0H584A16 16 0 0 1 600 16V44H0Z" fill="#161616"/>
    <circle cx="26" cy="22" r="6" fill="#F87171"/><circle cx="46" cy="22" r="6" fill="#FBBF24"/><circle cx="66" cy="22" r="6" fill="#4ADE80"/>
    <text x="300" y="27" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#7C7D82">.ship-site/report.md</text>
    <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" fill="#D6D7E4">
      <text x="28" y="82"><tspan fill="#F59E0B">❯</tspan> /ship-site fix</text>
      <text x="28" y="118"><tspan fill="#7C7D82">Detected </tspan> pnpm · Vercel · base develop · 14 routes</text>
      <text x="28" y="146"><tspan fill="#7C7D82">Audits   </tspan> design code security seo a11y <tspan fill="#22C55E">✓</tspan></text>
      <text x="28" y="174"><tspan fill="#7C7D82">Browser  </tspan> 28 screenshots · 0 CSP errors</text>
      <text x="28" y="202"><tspan fill="#7C7D82">Gates    </tspan> lint <tspan fill="#22C55E">✓</tspan> format <tspan fill="#22C55E">✓</tspan> build <tspan fill="#22C55E">✓</tspan> e2e 96/96 <tspan fill="#22C55E">✓</tspan></text>
      <line x1="28" y1="224" x2="572" y2="224" stroke="#2A2A2A"/>
      <text x="28" y="254"><tspan fill="#F87171" font-weight="700">B1</tspan> og:image dropped on /work/[slug]</text>
      <text x="572" y="254" text-anchor="end" fill="#4ADE80">fixed ✓</text>
      <text x="28" y="282"><tspan fill="#F87171" font-weight="700">B2</tspan> CSP blocks forms.example.com</text>
      <text x="572" y="282" text-anchor="end" fill="#4ADE80">fixed ✓</text>
      <text x="28" y="310"><tspan fill="#FBBF24" font-weight="700">S1</tspan> staging indexable (robots)</text>
      <text x="572" y="310" text-anchor="end" fill="#4ADE80">fixed ✓</text>
      <line x1="28" y1="334" x2="572" y2="334" stroke="#2A2A2A"/>
      <text x="28" y="378" fill="#B8B9BC">Verdict</text>
      <text x="200" y="378" fill="#7C7D82" text-decoration="line-through">NO-GO</text>
      <text x="268" y="378" fill="#7C7D82">→</text>
    </g>
    <rect x="296" y="352" width="76" height="38" rx="999" fill="#22C55E"/>
    <text x="334" y="378" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" font-weight="800" fill="#052E16">GO</text>
    <text x="572" y="378" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#7C7D82">push to staging? [y/N]</text>
  </g>
</svg>
