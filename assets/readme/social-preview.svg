<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="ship-site: ship the site, keep the receipts. A GO / NO-GO verdict for Next.js marketing sites, with evidence for every claim">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity=".06" stroke-width="1"/></pattern>
    <radialGradient id="glow" cx="80%" cy="38%" r="55%"><stop offset="0" stop-color="#F59E0B" stop-opacity=".2"/><stop offset="1" stop-color="#F59E0B" stop-opacity="0"/></radialGradient>
    <linearGradient id="fade" x1="0" x2="1"><stop offset="0" stop-color="#080808"/><stop offset=".5" stop-color="#080808" stop-opacity=".55"/><stop offset="1" stop-color="#080808" stop-opacity="0"/></linearGradient>
  </defs>
  <rect width="1280" height="640" fill="#080808"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>
  <rect width="1280" height="640" fill="url(#fade)"/>

  <!-- brand mark -->
  <g transform="translate(88 92) scale(.16)"><rect width="512" height="512" rx="112" fill="#F59E0B"/><path d="M88 296H424L360 396H152Z" fill="#080808"/><path d="M168 296 256 112V296Z" fill="#080808"/><path d="M256 112 344 296H256Z" fill="#3A2606"/><path d="M88 296H424L408 321H104Z" fill="#F59E0B" opacity=".18"/></g>
  <text x="194" y="161" font-family="'Space Grotesk',Manrope,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="76" font-weight="700" letter-spacing="-2" fill="#ECEDFD">ship<tspan fill="#F59E0B">-</tspan>site</text>

  <text x="88" y="292" font-family="'Space Grotesk',Manrope,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="56" font-weight="700" letter-spacing="-1.2" fill="#ECEDFD">Ship the site.</text>
  <text x="88" y="356" font-family="'Space Grotesk',Manrope,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="56" font-weight="700" letter-spacing="-1.2" fill="#F59E0B">Keep the receipts.</text>

  <text font-family="Manrope,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" fill="#B8B9BC">
    <tspan x="88" y="420">A release-readiness agent skill for Next.js marketing sites.</tspan>
    <tspan x="88" y="452">Audits, browser checks and tests, then a GO / NO-GO verdict</tspan>
    <tspan x="88" y="484">where every claim carries evidence.</tspan>
  </text>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" fill="#D6D7E4">
    <rect x="88" y="530" width="330" height="44" rx="22" fill="#FFFFFF" fill-opacity=".05" stroke="#FFFFFF" stroke-opacity=".16"/>
    <text x="112" y="558"><tspan fill="#F59E0B">❯</tspan> /ship-site audit</text>
  </g>

  <!-- verdict card -->
  <g transform="translate(736 120)">
    <rect width="456" height="400" rx="20" fill="#101010" stroke="#FFFFFF" stroke-opacity=".16"/>
    <path d="M0 20A20 20 0 0 1 20 0H436A20 20 0 0 1 456 20V56H0Z" fill="#161616"/>
    <circle cx="28" cy="28" r="7" fill="#F87171"/><circle cx="50" cy="28" r="7" fill="#FBBF24"/><circle cx="72" cy="28" r="7" fill="#4ADE80"/>
    <text x="228" y="33" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" fill="#7C7D82">report.md</text>
    <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" fill="#D6D7E4">
      <text x="28" y="108"><tspan fill="#7C7D82">Gates  </tspan> lint <tspan fill="#22C55E">✓</tspan>  build <tspan fill="#22C55E">✓</tspan>  e2e 96/96 <tspan fill="#22C55E">✓</tspan></text>
      <line x1="28" y1="136" x2="428" y2="136" stroke="#2A2A2A"/>
      <text x="28" y="172"><tspan fill="#F87171" font-weight="700">B1</tspan> og:image dropped</text>
      <text x="428" y="172" text-anchor="end" fill="#4ADE80">fixed ✓</text>
      <text x="28" y="206"><tspan fill="#F87171" font-weight="700">B2</tspan> CSP blocks form host</text>
      <text x="428" y="206" text-anchor="end" fill="#4ADE80">fixed ✓</text>
      <text x="28" y="240"><tspan fill="#FBBF24" font-weight="700">S1</tspan> staging indexable</text>
      <text x="428" y="240" text-anchor="end" fill="#4ADE80">fixed ✓</text>
      <line x1="28" y1="268" x2="428" y2="268" stroke="#2A2A2A"/>
    </g>
    <text x="28" y="324" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" fill="#B8B9BC">Verdict</text>
    <text x="134" y="324" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" fill="#7C7D82" text-decoration="line-through">NO-GO</text>
    <text x="206" y="324" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" fill="#7C7D82">→</text>
    <rect x="236" y="296" width="110" height="44" rx="22" fill="#22C55E"/>
    <text x="291" y="325" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="22" font-weight="800" fill="#052E16">GO</text>
    <text x="28" y="372" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" fill="#7C7D82">push to staging? [y/N]</text>
  </g>
</svg>
