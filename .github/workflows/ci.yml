name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit and end-to-end tests
        run: python -m unittest discover -s tests -v
      - name: Manifests and evals are valid JSON
        run: |
          for f in .claude-plugin/plugin.json .claude-plugin/marketplace.json skills/ship-site/evals/evals.json; do
            python -m json.tool "$f" > /dev/null
          done
