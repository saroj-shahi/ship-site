name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Pinned: ubuntu-latest (26.04) has no Python 3.9 build, and the scripts support 3.9+.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Unit and end-to-end tests
        run: python -m unittest discover -s tests -v
      - name: Manifests and evals are valid JSON
        run: |
          for f in .claude-plugin/plugin.json .claude-plugin/marketplace.json skills/ship-site/evals/evals.json; do
            python -m json.tool "$f" > /dev/null
          done
